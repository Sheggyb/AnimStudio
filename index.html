<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnimStudio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 23l7-14 7 14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='9' r='2.5' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">◭</span> AnimStudio</div>
      <nav id="menubar"></nav>
      <div id="modelPill" class="pill" title="Current model"></div>
      <div class="grow"></div>
      <button id="btnPalette" class="ghost" title="Search all commands (Ctrl+K)">⌕ Commands <kbd>Ctrl K</kbd></button>
      <button id="btnSave" class="ghost" title="Save project (Ctrl+S)">Save</button>
      <button id="btnExport" class="primary" title="Export GLB (Ctrl+E)">Export GLB</button>
    </header>

    <div id="workspace">
      <aside id="left" class="panel"></aside>
      <section id="center">
        <div id="viewport"></div>
        <div id="vpToolbar" class="vp-toolbar"></div>
        <div id="vpViewbar" class="vp-toolbar right"></div>
        <div id="vpHud"></div>
        <div id="vpWarn" class="hidden"></div>
        <div id="dropHint" class="hidden"><div>Drop a .glb model, project or clip file</div></div>
      </section>
      <aside id="right" class="panel"></aside>
    </div>

    <div id="hsplit" title="Drag to resize"></div>
    <section id="bottom"></section>
    <footer id="statusbar"></footer>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
